/**:
  ros__parameters:
    use_sim_time: True

  amcl:
    ros__parameters:
      use_sim_time: True
      global_frame_id: "robot_4dw/map"
      odom_frame_id: "robot_4dw/odom"
      base_frame_id: "robot_4dw/base_footprint"
      scan_topic: "/robot_4dw/scan"
      message_filter_queue_size: 50
  
  bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: "robot_4dw/map"
      robot_base_frame: "robot_4dw/base_footprint"
      odom_topic: "/robot_4dw/odom"
  
  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: True
        global_frame: "robot_4dw/odom"
        robot_base_frame: "robot_4dw/base_footprint"
        transform_tolerance: 30.0  # ★ タイムアウト猶予を3秒に拡張
        publish_frequency: 1.0         # ★ 重い環境用に更新頻度を落とす (デフォルト5.0Hz -> 1.0Hz)
        update_frequency: 2.0          # ★ マップ更新頻度も落とす (デフォルト5.0Hz -> 2.0Hz)
        rolling_window: true        # ★ ロボットの現在位置を中心にローカル枠を追従させる
        width: 4
        height: 4
        resolution: 0.05
  
  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: True
        global_frame: "robot_4dw/map"
        robot_base_frame: "robot_4dw/base_footprint"
        transform_tolerance: 3.0  # ★ タイムアウト猶予を3秒に拡張
        publish_frequency: 0.5
        update_frequency: 1.0
        rolling_window: false       # フィールド全体を覆う固定マップ
        width: 16                   # X方向: -8m ～ +8m をカバー (幅16m)
        height: 10                  # Y方向: -1m ～ +9m をカバー (高さ10m)
        origin_x: -8.0              # ★ X方向の原点オフセット
        origin_y: -1.0              # ★ Y方向の原点オフセット (Y=0付近の初期位置Y=0.5を余裕で包含)
        resolution: 0.05
        track_unknown_space: true
  
  planner_server:
    ros__parameters:
      use_sim_time: true  # ★ ここを true に修正

  controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]
      cmd_vel_topic: "/robot_4dw/cmd_vel"
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.25
      FollowPath:
        # plugin: "dwb_core::DWBLocalPlanner"
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        debug_trajectory_details: True
        # transform_tolerance: 30
        min_vel_x: 0.0
        min_vel_y: 0.0
        max_vel_x: 0.26
        max_vel_y: 0.0
        max_vel_theta: 1.0
        min_speed_xy: 0.0
        max_speed_xy: 0.26
        min_speed_theta: 0.0
        acc_lim_x: 2.5
        acc_lim_y: 0.0
        acc_lim_theta: 3.2
        decel_lim_x: -2.5
        decel_lim_y: 0.0
        decel_lim_theta: -3.2
        # --- 必須: DWB の評価関数（Critics）設定 ---
        critics:
          - RotateToGoal
          - Oscillation
          - BaseObstacle
          - GoalAlign
          - PathAlign
          - PathDist
          - GoalDist
        BaseObstacle:
          plugin: "dwb_critics::BaseObstacleCritic"
          cost_scale: 0.02
        GoalAlign:
          plugin: "dwb_critics::GoalAlignCritic"
          forward_point_distance: 0.1
          cost_scale: 24.0
        PathAlign:
          plugin: "dwb_critics::PathAlignCritic"
          forward_point_distance: 0.1
          cost_scale: 32.0
        PathDist:
          plugin: "dwb_critics::PathDistCritic"
          cost_scale: 32.0
        GoalDist:
          plugin: "dwb_critics::GoalDistCritic"
          cost_scale: 24.0
        RotateToGoal:
          plugin: "dwb_critics::RotateToGoalCritic"
          slowing_factor: 5.0
          lookahead_time: -1.0
  
  collision_monitor:
    ros__parameters:
      use_sim_time: True
      base_frame_id: "robot_4dw/base_footprint"
      odom_frame_id: "robot_4dw/odom"
      cmd_vel_in_topic: "/robot_4dw/cmd_vel_smoothed"
      cmd_vel_out_topic: "/robot_4dw/cmd_vel"
      state_topic: "collision_monitor_state"
      transform_tolerance: 0.2
      source_timeout: 1.0
      stop_pub_timeout: 2.0
      polygons: ["Polygons/Stop"]
      Polygons/Stop:
        type: "polygon"
        points: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"
        action_type: "stop"
        max_points: 4
        visualize: True
        polygon_pub_topic: "polygon_stop"
      observation_sources: ["scan"]
      scan:
        type: "scan"
        topic: "/robot_4dw/scan"
  
  docking_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 50.0
      initial_perception_timeout: 5.0
      wait_charge_timeout: 5.0
      dock_approach_timeout: 30.0
      undock_linear_tolerance: 0.05
      undock_angular_tolerance: 0.1
      max_retries: 3
      base_frame: "robot_4dw/base_footprint"
      fixed_frame: "robot_4dw/odom"
      dock_backwards: false
      dock_plugins: ['simple_charging_dock']
      simple_charging_dock:
        plugin: 'opennav_docking::SimpleChargingDock'
        docking_threshold: 0.05
        untethered_charge_time: 15.0
        dock_type: 'simple_charging_dock'
  
  behavior_server:
    ros__parameters:
      use_sim_time: True
      global_frame: "robot_4dw/odom"          # ★ 先頭スラッシュ無しのネームスペース付き
      robot_base_frame: "robot_4dw/base_footprint"
  
  map_server:
    ros__parameters:
      use_sim_time: True
      frame_id: "robot_4dw/map"  # ★ 'map' から 'robot_4dw/map' に統一
      topic_name: "/robot_4dw/map"
  
  velocity_smoother:
    ros__parameters:
      use_sim_time: True
      cmd_vel_out_topic: "/robot_4dw/cmd_vel"
  
